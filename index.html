<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07061a" />
    <meta name="description" content="Cosmic Sky: mapa astral preciso, céu do dia e previsões personalizadas com trânsitos planetários." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Cosmic Sky" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Noto+Sans+Symbols:wght@400;600&family=Noto+Sans+Symbols+2&display=swap"
      rel="stylesheet"
    />
    <title>Cosmic Sky · Mapa Astral</title>
    <link rel="preload" as="image" href="./icons/splash.webp" imagesrcset="./icons/splash-small.webp 470w, ./icons/splash.webp 941w" imagesizes="max(100vw, 56vh)" />
    <style>
      /* Tela de abertura: aparece antes do app carregar e some quando ele está pronto (src/main.tsx). */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden; background: #090830; transition: opacity 0.7s ease, visibility 0.7s ease; }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .splash-bg { position: absolute; inset: -10%; background: #090830 url('./icons/splash-small.webp') center / cover no-repeat; filter: blur(36px) brightness(0.55) saturate(1.2); }
      #splash img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; animation: splash-in 1.1s ease-out both; }
      #splash .splash-bar { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 2px; margin-left: -60px; border-radius: 2px; overflow: hidden; background: rgba(255, 232, 163, 0.18); }
      #splash .splash-bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #ffe8a3, transparent); animation: splash-load 1.2s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash img, #splash .splash-bar::after { animation: none; transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-bg"></div>
      <img src="./icons/splash.webp" srcset="./icons/splash-small.webp 470w, ./icons/splash.webp 941w" sizes="max(100vw, 56vh)" alt="" />
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
