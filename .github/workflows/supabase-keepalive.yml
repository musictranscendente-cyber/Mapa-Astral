name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without database activity, which takes
# login and sync down. A small daily query keeps the project awake.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY não configuradas — nada a fazer."
            exit 0
          fi
          base=$(echo "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          # Row-level security returns an empty list to the anon key, but the query still reaches Postgres.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/rest/v1/birth_profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::O projeto Supabase não respondeu (HTTP $code). Se estiver pausado, clique em Resume project no painel."
            exit 1
          fi

          # Tables created by each migration: a 404 means that migration still has to be run in the SQL Editor.
          for pair in birth_profiles:0001 entitlements:0002 purchases:0002 analysis_log:0002 app_events:0003; do
            table=${pair%%:*}; mig=${pair##*:}
            c=$(curl -sS -o /dev/null -w '%{http_code}' "$base/rest/v1/$table?select=*&limit=0" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$c" = "404" ]; then echo "::warning::Tabela $table não existe — rode a migração $mig no SQL Editor do Supabase."; else echo "Tabela $table: ok (HTTP $c)"; fi
          done

          # Edge Function for the full analysis: without login it must answer 401 (published and running).
          c=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/functions/v1/analysis" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          if [ "$c" = "404" ]; then echo "::warning::Função analysis não publicada — rode Actions → Supabase Functions."; else echo "Função analysis: respondeu HTTP $c"; fi
